# فرم‌ساز ICSD — فقط برای __DOMAIN__؛ سایت‌های دیگر این سرور دست نمی‌خورند.
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 30M;
    access_log /var/log/nginx/icsdforms.access.log;
    error_log  /var/log/nginx/icsdforms.error.log;

    location /media/ {
        alias /srv/icsdforms/media/;
        expires 30d;
        add_header Cache-Control "public";
        # فایل‌های آپلودی پاسخ‌دهندگان هرگز اسکریپت اجرا نکنند
        add_header Content-Security-Policy "script-src 'none'; object-src 'none'";
        add_header X-Content-Type-Options nosniff;
    }
    location /static/ {
        alias /srv/icsdforms/app/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        proxy_pass http://unix:/run/icsdforms/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;
}
