{% load panel %}{% with t=f|field_type %}
{% if t == "switch" %}
<div class="fld fld--switch {% if f.errors %}has-err{% endif %}">
  <div class="form-switch m-0">{{ f }}</div>
  <div><label for="{{ f.id_for_label }}">{{ f.label }}</label>{% if f.help_text %}<div class="help">{{ f.help_text|safe }}</div>{% endif %}</div>
</div>
{% else %}
<div class="fld {% if f|is_wide or t == 'file' and wide_files %}fld--wide{% endif %} {% if f.errors %}has-err{% endif %}">
  <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<div class="help">{{ f.help_text|safe }}</div>{% endif %}
  {% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
{% endif %}{% endwith %}
