{% load ui %}{% if faqs %}
<div class="accordion faq" id="faq">
  {% for f in faqs %}
  <div class="accordion-item">
    <h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq{{ f.pk }}" aria-expanded="false" aria-controls="faq{{ f.pk }}">{{ f.question }}</button></h3>
    <div id="faq{{ f.pk }}" class="accordion-collapse collapse" data-bs-parent="#faq"><div class="accordion-body">{{ f.answer|linebreaksbr }}</div></div>
  </div>
  {% endfor %}
</div>
{% endif %}
